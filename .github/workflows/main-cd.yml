
name: Deploy to Databricks

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Databricks CLI
      run: pip install databricks-cli

    - name: Configure Databricks CLI
      run: |
        databricks configure --token <<EOF
        ${{ secrets.DATABRICKS_HOST }}
        ${{ secrets.DATABRICKS_TOKEN }}
        EOF

    - name: Deploy to Databricks Repo
      run: |
        databricks repos update \
          --repo-id ${{ secrets.REPO_ID }} \
          --path .

    - name: Deploy Job Definition
      run: |
        databricks jobs reset \
          --job-id ${{ secrets.JOB_ID }} \
          --json-file job_definitions/etl_job.json

    - name: Trigger Job
      run: databricks jobs run-now --job-id ${{ secrets.JOB_ID }}
